
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
    }

    header {
      padding: 22px;
      background: #151d33;
    }

    main {
      padding: 70px 20px;
    }

    h1 {
      font-size: 38px;
      color: #67e8f9;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      background: #06b6d4;
      color: #06111e;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <header>
    <strong>MY WEBSITE</strong>
  </header>

  <main>
    <h1>Welcome to My World</h1>
    <p>
      I am building something amazing with technology.
      This is my own website, created using Termux.
    </p>
    <a class="button" href="mailto:hello@example.com">
      Contact Me
    </a>
  </main>

  <footer>
    &copy; 2026 My Website
  </footer>
</body>
</html>
